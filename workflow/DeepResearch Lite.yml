    - data:
        code: "def main(\n    url: str,\n    title: str,\n    domain: str,\n    source_type:\
          \ str,\n    rank_score: float,\n    dimensions: list,\n    page_text: str,\n\
          \    snippet: str\n) -> dict:\n\n    page_text = (page_text or \"\").strip()\n\
          \    snippet = (snippet or \"\").strip()\n\n    # 判断 Jina 是否返回了明显错误页\n \
          \   error_signals = [\n        '\"code\": 451',\n        '\"status\": 45101',\n\
          \        \"excluded from Jina Reader\",\n        \"cease automated access\"\
          ,\n        \"error_message\"\n    ]\n\n    crawl_failed = (\n        not\
          \ page_text\n        or any(signal in page_text for signal in error_signals)\n\
          \    )\n\n    if crawl_failed:\n        content = snippet\n        crawl_status\
          \ = \"fallback\"\n    else:\n        content = page_text\n        crawl_status\
          \ = \"success\"\n\n    return {\n        \"source\": {\n            \"title\"\
          : title,\n            \"url\": url,\n            \"domain\": domain,\n \
          \           \"source_type\": source_type,\n            \"rank_score\": rank_score,\n\
          \            \"dimensions\": dimensions,\n            \"page_content\":\
          \ content,\n            \"crawl_status\": crawl_status\n        }\n    }"
