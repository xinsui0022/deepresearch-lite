    - data:
        code: "import json\nimport ast\n\n\ndef main(evidence: list) -> dict:\n  \
          \  if not evidence:\n        return {\n            \"evidence_context\"\
          : \"No valid evidence was collected.\",\n            \"sources_markdown\"\
          : \"\",\n            \"evidence_count\": 0\n        }\n\n    source_ids\
          \ = {}\n    sources = []\n    evidence_lines = []\n\n    for index, item\
          \ in enumerate(evidence, start=1):\n\n        # -----------------------------\n\
          \        # 兼容 Dify 把 Object 变成 String\n        # -----------------------------\n\
          \        if isinstance(item, str):\n            text = item.strip()\n\n\
          \            if not text:\n                continue\n\n            try:\n\
          \                item = json.loads(text)\n            except json.JSONDecodeError:\n\
          \                try:\n                    item = ast.literal_eval(text)\n\
          \                except Exception:\n                    continue\n\n   \
          \     # 最终必须是 dict\n        if not isinstance(item, dict):\n           \
          \ continue\n\n        claim = str(\n            item.get(\"claim\", \"\"\
          )\n        ).strip()\n\n        if not claim:\n            continue\n\n\
          \        url = str(\n            item.get(\"source_url\", \"\")\n      \
          \  ).strip()\n\n        title = str(\n            item.get(\"source_title\"\
          , \"\")\n        ).strip()\n\n        dimension = str(\n            item.get(\"\
          dimension\", \"\")\n        ).strip()\n\n        support = str(\n      \
          \      item.get(\"support\", \"\")\n        ).strip()\n\n        importance\
          \ = str(\n            item.get(\"importance\", \"medium\")\n        ).strip()\n\
          \n        source_type = str(\n            item.get(\"source_type\", \"\"\
          )\n        ).strip()\n\n        # 同一个 URL 只分配一个 Source ID\n        source_key\
          \ = url or title\n\n        if not source_key:\n            source_key =\
          \ f\"unknown-source-{index}\"\n\n        if source_key not in source_ids:\n\
          \            source_id = f\"S{len(source_ids) + 1}\"\n            source_ids[source_key]\
          \ = source_id\n\n            sources.append({\n                \"id\": source_id,\n\
          \                \"title\": title,\n                \"url\": url\n     \
          \       })\n\n        source_id = source_ids[source_key]\n\n        evidence_lines.append(\n\
          \            f\"\"\"[Evidence {index}]\nDimension: {dimension}\nClaim: {claim}\n\
          Support: {support}\nImportance: {importance}\nSource Type: {source_type}\n\
          Source: [{source_id}] {title}\n\"\"\"\n        )\n\n    sources_markdown\
          \ = \"\\n\".join(\n        f\"- [{source['id']}] [{source['title']}]({source['url']})\"\
          \n        for source in sources\n        if source[\"url\"]\n    )\n\n \
          \   return {\n        \"evidence_context\": \"\\n\".join(evidence_lines),\n\
          \        \"sources_markdown\": sources_markdown,\n        \"evidence_count\"\
          : len(evidence_lines)\n    }"
        code_language: python3
