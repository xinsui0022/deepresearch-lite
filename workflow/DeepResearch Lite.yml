    - data:
        code: "import json\nimport re\n\ndef main(\n    text: str,\n    source_title:\
          \ str,\n    source_url: str,\n    source_type: str,\n    rank_score: float\n\
          ) -> dict:\n\n    text = (text or \"\").strip()\n\n    # 清理 ```json ...\
          \ ```\n    text = re.sub(r\"^```(?:json)?\\s*\", \"\", text)\n    text =\
          \ re.sub(r\"\\s*```$\", \"\", text)\n\n    start = text.find(\"{\")\n  \
          \  end = text.rfind(\"}\")\n\n    if start == -1 or end == -1:\n       \
          \ return {\n            \"evidence\": []\n        }\n\n    try:\n      \
          \  data = json.loads(text[start:end + 1])\n    except json.JSONDecodeError:\n\
          \        return {\n            \"evidence\": []\n        }\n\n    raw_evidence\
          \ = data.get(\"evidence\", [])\n\n    if not isinstance(raw_evidence, list):\n\
          \        return {\n            \"evidence\": []\n        }\n\n    result\
          \ = []\n\n    for item in raw_evidence:\n        if not isinstance(item,\
          \ dict):\n            continue\n\n        claim = str(item.get(\"claim\"\
          , \"\")).strip()\n\n        if not claim:\n            continue\n\n    \
          \    importance = str(\n            item.get(\"importance\", \"medium\"\
          )\n        ).strip().lower()\n\n        if importance not in {\"high\",\
          \ \"medium\", \"low\"}:\n            importance = \"medium\"\n\n       \
          \ result.append({\n            \"dimension\": str(\n                item.get(\"\
          dimension\", \"\")\n            ).strip(),\n\n            \"claim\": claim,\n\
          \n            \"support\": str(\n                item.get(\"support\", \"\
          \")\n            ).strip(),\n\n            \"importance\": importance,\n\
          \n            \"source_title\": source_title,\n            \"source_url\"\
          : source_url,\n            \"source_type\": source_type,\n            \"\
          source_rank_score\": float(rank_score or 0)\n        })\n\n    return {\n\
          \        \"evidence\": result\n    }"
        code_language: python3
        isInIteration: true
        isInLoop: false
