    - data:
        code: "import re\nfrom urllib.parse import urlsplit, parse_qsl, urlencode\n\
          \n\nTRACKING_PARAMS = {\n    \"spm\",\n    \"from\",\n    \"source\",\n\
          \    \"ref\",\n    \"referrer\",\n    \"campaign\",\n    \"track\",\n}\n\
          \n\ndef clean_url(url: str) -> str:\n    url = (url or \"\").strip()\n\n\
          \    # 防御 Markdown 链接：\n    # [https://a.com](https://a.com)\n    match\
          \ = re.fullmatch(r\"\\[(https?://[^\\]]+)\\]\\((https?://[^)]+)\\)\", url)\n\
          \    if match:\n        url = match.group(2)\n\n    return url\n\n\ndef\
          \ get_domain(url: str) -> str:\n    host = urlsplit(url).netloc.lower()\n\
          \n    if host.startswith(\"www.\"):\n        host = host[4:]\n\n    return\
          \ host\n\n\ndef make_url_key(url: str) -> str:\n    \"\"\"\n    用于去重的 URL\
          \ key。\n    不直接修改后续真正访问时使用的原始 URL。\n    \"\"\"\n    parts = urlsplit(url)\n\
          \n    host = parts.netloc.lower()\n    if host.startswith(\"www.\"):\n \
          \       host = host[4:]\n\n    path = parts.path.rstrip(\"/\") or \"/\"\n\
          \n    query_items = []\n\n    for key, value in parse_qsl(parts.query, keep_blank_values=True):\n\
          \        lower_key = key.lower()\n\n        if lower_key.startswith(\"utm_\"\
          ):\n            continue\n\n        if lower_key in TRACKING_PARAMS:\n \
          \           continue\n\n        query_items.append((key, value))\n\n   \
          \ query_items.sort()\n\n    query = urlencode(query_items, doseq=True)\n\
          \n    # 故意忽略 http / https 的区别\n    return f\"{host}{path}?{query}\" if query\
          \ else f\"{host}{path}\"\n\n\ndef classify_source(domain: str) -> str:\n\
          \    \"\"\"\n    这里只做基础规则分类。\n    不是最终的“权威性判断”。\n    \"\"\"\n\n    if domain.endswith(\"\
          .gov.cn\") or domain.endswith(\"gov.cn\"):\n        return \"government\"\
          \n\n    if domain.endswith(\".edu.cn\"):\n        return \"education\"\n\
          \n    if domain.endswith(\".org.cn\"):\n        return \"organization\"\n\
          \n    job_platforms = {\n        \"liepin.com\",\n        \"zhaopin.com\"\
          ,\n        \"51job.com\",\n        \"bosszhipin.com\",\n        \"gaoxiaojob.com\"\
          ,\n        \"indeed.com\",\n        \"cn.indeed.com\",\n    }\n\n    news_media\
          \ = {\n        \"xinhuanet.com\",\n        \"chinadaily.com.cn\",\n    \
          \    \"stdaily.com\",\n        \"stcn.com\",\n        \"dayoo.com\",\n \
          \       \"people.com.cn\",\n    }\n\n    developer_communities = {\n   \
          \     \"csdn.net\",\n        \"juejin.cn\",\n        \"zhihu.com\",\n  \
          \  }\n\n    if domain in job_platforms or any(\n        domain.endswith(\"\
          .\" + d) for d in job_platforms\n    ):\n        return \"job_platform\"\
          \n\n    if domain in news_media or any(\n        domain.endswith(\".\" +\
          \ d) for d in news_media\n    ):\n        return \"news_media\"\n\n    if\
          \ domain in developer_communities or any(\n        domain.endswith(\".\"\
          \ + d) for d in developer_communities\n    ):\n        return \"developer_community\"\
          \n\n    return \"other\"\n\n\ndef main(results: list) -> dict:\n    merged\
          \ = {}\n\n    for item in results:\n        url = clean_url(str(item.get(\"\
          url\", \"\")))\n\n        if not url:\n            continue\n\n        key\
          \ = make_url_key(url)\n\n        dimension = str(item.get(\"dimension\"\
          , \"\")).strip()\n        query = str(item.get(\"query\", \"\")).strip()\n\
          \        title = str(item.get(\"title\", \"\")).strip()\n        snippet\
          \ = str(item.get(\"snippet\", \"\")).strip()\n\n        try:\n         \
          \   score = float(item.get(\"search_score\", 0) or 0)\n        except (TypeError,\
          \ ValueError):\n            score = 0.0\n\n        if key not in merged:\n\
          \            domain = get_domain(url)\n\n            merged[key] = {\n \
          \               \"title\": title,\n                \"url\": url,\n     \
          \           \"domain\": domain,\n                \"source_type\": classify_source(domain),\n\
          \                \"dimensions\": [],\n                \"queries\": [],\n\
          \                \"snippet\": snippet,\n                \"search_score\"\
          : score,\n            }\n\n        source = merged[key]\n\n        if dimension\
          \ and dimension not in source[\"dimensions\"]:\n            source[\"dimensions\"\
          ].append(dimension)\n\n        if query and query not in source[\"queries\"\
          ]:\n            source[\"queries\"].append(query)\n\n        # 同一个 URL 多次被搜到时，保留最高\
          \ Tavily score\n        if score > source[\"search_score\"]:\n         \
          \   source[\"search_score\"] = score\n            source[\"title\"] = title\
          \ or source[\"title\"]\n\n        # 暂时保留信息量更大的 snippet\n        if len(snippet)\
          \ > len(source[\"snippet\"]):\n            source[\"snippet\"] = snippet\n\
          \n    return {\n        \"sources\": list(merged.values())\n    }"
        code_language: python3
