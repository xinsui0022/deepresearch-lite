    - data:
        code: "import re\nfrom datetime import datetime\n\n\nCURRENT_YEAR = datetime.now().year\n\
          \n\nBASE_AUTHORITY = {\n    \"government\": 0.90,\n    \"education\": 0.85,\n\
          \    \"organization\": 0.80,\n    \"news_media\": 0.75,\n    \"job_platform\"\
          : 0.72,\n    \"company\": 0.72,\n    \"developer_community\": 0.45,\n  \
          \  \"other\": 0.55,\n}\n\n\ndef clamp(value, low=0.0, high=1.0):\n    return\
          \ max(low, min(high, value))\n\n\ndef domain_matches(domain: str, target:\
          \ str) -> bool:\n    return domain == target or domain.endswith(\".\" +\
          \ target)\n\n\ndef refine_source_type(source_type: str, domain: str) ->\
          \ str:\n    \"\"\"\n    对 Prepare Sources 中没覆盖到的少数常见域名做补充。\n    后续可以继续扩展白名单。\n\
          \    \"\"\"\n    news_domains = {\n        \"sina.com.cn\",\n        \"\
          xinhuanet.com\",\n        \"chinadaily.com.cn\",\n        \"stdaily.com\"\
          ,\n        \"stcn.com\",\n        \"dayoo.com\",\n        \"people.com.cn\"\
          ,\n    }\n\n    organization_domains = {\n        \"wrsa.net\",\n      \
          \  \"miitec.cn\",\n    }\n\n    company_domains = {\n        \"ibm.com\"\
          ,\n    }\n\n    for d in news_domains:\n        if domain_matches(domain,\
          \ d):\n            return \"news_media\"\n\n    for d in organization_domains:\n\
          \        if domain_matches(domain, d):\n            return \"organization\"\
          \n\n    for d in company_domains:\n        if domain_matches(domain, d):\n\
          \            return \"company\"\n\n    return source_type or \"other\"\n\
          \n\ndef calculate_authority(source_type: str, dimensions: list) -> float:\n\
          \    \"\"\"\n    来源质量不是固定的，而要结合研究维度。\n    \"\"\"\n\n    score = BASE_AUTHORITY.get(source_type,\
          \ 0.55)\n    dimension_text = \" \".join(dimensions)\n\n    # 招聘、薪资、岗位类问题：\n\
          \    # 招聘平台是直接数据源，因此给予额外权重。\n    if any(\n        key in dimension_text\n\
          \        for key in [\"招聘\", \"薪资\", \"就业\", \"岗位\", \"任职\", \"技能\"]\n \
          \   ):\n        if source_type == \"job_platform\":\n            score +=\
          \ 0.15\n        elif source_type in {\n            \"government\",\n   \
          \         \"education\",\n            \"organization\",\n            \"\
          news_media\",\n        }:\n            score += 0.05\n\n    # 政策、产业环境类问题：\n\
          \    # 政府原始来源更重要。\n    if any(\n        key in dimension_text\n        for\
          \ key in [\"政策\", \"产业\", \"环境\", \"发展\", \"规划\"]\n    ):\n        if source_type\
          \ == \"government\":\n            score += 0.10\n        elif source_type\
          \ in {\"organization\", \"news_media\"}:\n            score += 0.05\n\n\
          \    # 教育、人才培养类问题\n    if any(\n        key in dimension_text\n        for\
          \ key in [\"教育\", \"高校\", \"培养\", \"人才\"]\n    ):\n        if source_type\
          \ == \"education\":\n            score += 0.10\n        elif source_type\
          \ in {\"government\", \"organization\"}:\n            score += 0.07\n\n\
          \    return clamp(score)\n\n\ndef extract_published_year(source: dict):\n\
          \    \"\"\"\n    优先从标题和 URL 判断年份。\n    snippet 只作为 fallback，避免把文章中的未来预测年份\n\
          \    错认为发布时间。\n    \"\"\"\n\n    primary_text = (\n        str(source.get(\"\
          title\", \"\"))\n        + \" \"\n        + str(source.get(\"url\", \"\"\
          ))\n    )\n\n    years = [\n        int(x)\n        for x in re.findall(r\"\
          20\\d{2}\", primary_text)\n    ]\n\n    valid_years = [\n        y for y\
          \ in years\n        if 2000 <= y <= CURRENT_YEAR\n    ]\n\n    if valid_years:\n\
          \        return max(valid_years)\n\n    # fallback：只检查 snippet 前一小段\n  \
          \  snippet = str(source.get(\"snippet\", \"\"))[:500]\n\n    years = [\n\
          \        int(x)\n        for x in re.findall(r\"20\\d{2}\", snippet)\n \
          \   ]\n\n    valid_years = [\n        y for y in years\n        if 2000\
          \ <= y <= CURRENT_YEAR\n    ]\n\n    if valid_years:\n        return max(valid_years)\n\
          \n    return None\n\n\ndef calculate_freshness(year):\n    if year is None:\n\
          \        return 0.55\n\n    age = CURRENT_YEAR - year\n\n    if age <= 0:\n\
          \        return 1.00\n    elif age == 1:\n        return 0.85\n    elif\
          \ age == 2:\n        return 0.70\n    elif age == 3:\n        return 0.55\n\
          \    else:\n        return 0.40\n\n\ndef calculate_coverage(source: dict):\n\
          \    query_count = len(set(source.get(\"queries\", [])))\n    dimension_count\
          \ = len(set(source.get(\"dimensions\", [])))\n\n    score = 0.55\n\n   \
          \ # 被不同 Query 重复搜到，说明可能较重要\n    score += max(0, query_count - 1) * 0.15\n\
          \n    # 同时覆盖多个研究维度，也给予少量奖励\n    score += max(0, dimension_count - 1) * 0.10\n\
          \n    return clamp(score)\n\n\ndef main(sources: list) -> dict:\n    ranked\
          \ = []\n\n    for source in sources:\n        item = dict(source)\n\n  \
          \      domain = str(item.get(\"domain\", \"\")).lower()\n        source_type\
          \ = refine_source_type(\n            str(item.get(\"source_type\", \"other\"\
          )),\n            domain\n        )\n\n        dimensions = item.get(\"dimensions\"\
          , []) or []\n\n        try:\n            search_score = float(\n       \
          \         item.get(\"search_score\", 0) or 0\n            )\n        except\
          \ (TypeError, ValueError):\n            search_score = 0.0\n\n        search_score\
          \ = clamp(search_score)\n\n        authority_score = calculate_authority(\n\
          \            source_type,\n            dimensions\n        )\n\n       \
          \ published_year = extract_published_year(item)\n\n        freshness_score\
          \ = calculate_freshness(\n            published_year\n        )\n\n    \
          \    coverage_score = calculate_coverage(item)\n\n        rank_score = (\n\
          \            search_score * 0.50\n            + authority_score * 0.25\n\
          \            + freshness_score * 0.15\n            + coverage_score * 0.10\n\
          \        )\n\n        item[\"source_type\"] = source_type\n        item[\"\
          published_year\"] = published_year\n        item[\"authority_score\"] =\
          \ round(\n            authority_score, 4\n        )\n        item[\"freshness_score\"\
          ] = round(\n            freshness_score, 4\n        )\n        item[\"coverage_score\"\
          ] = round(\n            coverage_score, 4\n        )\n        item[\"rank_score\"\
          ] = round(\n            rank_score, 4\n        )\n\n        ranked.append(item)\n\
          \n    ranked.sort(\n        key=lambda x: x[\"rank_score\"],\n        reverse=True\n\
          \    )\n\n    for index, item in enumerate(ranked, start=1):\n        item[\"\
          rank\"] = index\n\n    return {\n        \"ranked_sources\": ranked\n  \
          \  }"
        code_language: python3
