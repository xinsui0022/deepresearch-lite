    - data:
        code: "def main(ranked_sources: list) -> dict:\n    if not ranked_sources:\n\
          \        return {\n            \"selected_sources\": []\n        }\n\n \
          \   # 每个研究维度至少争取保留多少来源\n    MIN_PER_DIMENSION = 2\n\n    # 最终最多进入 Crawl\
          \ 的来源数量\n    MAX_TOTAL = 4\n\n    # 分数太低的来源暂时不进入下一阶段\n    MIN_RANK_SCORE\
          \ = 0.60\n\n    selected = []\n    selected_urls = set()\n\n    # 找到本次研究涉及的全部维度\n\
          \    dimensions = []\n\n    for source in ranked_sources:\n        for dimension\
          \ in source.get(\"dimensions\", []):\n            if dimension not in dimensions:\n\
          \                dimensions.append(dimension)\n\n    # --------------------------------------------------\n\
          \    # 1. 先保证每个维度有基本覆盖\n    # --------------------------------------------------\n\
          \n    for dimension in dimensions:\n        dimension_sources = []\n\n \
          \       for source in ranked_sources:\n            if (\n              \
          \  dimension in source.get(\"dimensions\", [])\n                and source.get(\"\
          rank_score\", 0) >= MIN_RANK_SCORE\n            ):\n                dimension_sources.append(source)\n\
          \n        # ranked_sources 本来已经按 rank_score 排序\n        for source in dimension_sources[:MIN_PER_DIMENSION]:\n\
          \            url = source.get(\"url\")\n\n            if url and url not\
          \ in selected_urls:\n                selected.append(source)\n         \
          \       selected_urls.add(url)\n\n    # --------------------------------------------------\n\
          \    # 2. 剩余位置按全局排名补齐\n    # --------------------------------------------------\n\
          \n    for source in ranked_sources:\n        if len(selected) >= MAX_TOTAL:\n\
          \            break\n\n        if source.get(\"rank_score\", 0) < MIN_RANK_SCORE:\n\
          \            continue\n\n        url = source.get(\"url\")\n\n        if\
          \ url and url not in selected_urls:\n            selected.append(source)\n\
          \            selected_urls.add(url)\n\n    # --------------------------------------------------\n\
          \    # 3. 最终重新按照 rank_score 排序\n    # --------------------------------------------------\n\
          \n    selected.sort(\n        key=lambda x: x.get(\"rank_score\", 0),\n\
          \        reverse=True\n    )\n\n    # 给选中的来源额外编号\n    for index, source\
          \ in enumerate(selected, start=1):\n        source[\"selection_rank\"] =\
          \ index\n\n    return {\n        \"selected_sources\": selected\n    }"
