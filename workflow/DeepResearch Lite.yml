    - data:
        code: "import json\nimport ast\n\ndef main(item) -> dict:\n    if isinstance(item,\
          \ dict):\n        data = item\n    elif isinstance(item, str):\n       \
          \ try:\n            data = json.loads(item)\n        except json.JSONDecodeError:\n\
          \            data = ast.literal_eval(item)\n    else:\n        raise ValueError(f\"\
          Unsupported item type: {type(item)}\")\n\n    query = str(data.get(\"query\"\
          , \"\")).strip()\n    dimension = str(data.get(\"dimension\", \"\")).strip()\n\
          \n    if not query:\n        raise ValueError(\"query is missing\")\n\n\
          \    if not dimension:\n        dimension = \"general research\"\n\n   \
          \ return {\n        \"query\": query,\n        \"dimension\": dimension\n\
          \    }"
        code_language: python3
