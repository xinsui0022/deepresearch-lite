    - data:
        code: "def main(dimension: str, query: str, tavily_json: list) -> dict:\n\
          \    if not tavily_json:\n        return {\n            \"normalized_results\"\
          : []\n        }\n\n    # Tavily 当前返回 Array[Object]，实际搜索结果在第一个对象的 results\
          \ 中\n    payload = tavily_json[0]\n\n    results = payload.get(\"results\"\
          , [])\n\n    normalized_results = []\n\n    for result in results:\n   \
          \     normalized_results.append({\n            \"dimension\": dimension,\n\
          \            \"query\": query,\n            \"title\": result.get(\"title\"\
          , \"\"),\n            \"url\": result.get(\"url\", \"\"),\n            \"\
          snippet\": result.get(\"content\", \"\"),\n            \"search_score\"\
          : float(result.get(\"score\", 0) or 0)\n        })\n\n    return {\n   \
          \     \"normalized_results\": normalized_results\n    }"
        code_language: python3
